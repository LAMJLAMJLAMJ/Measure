name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS, Accelerate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
      - name: Bundle the app
        run: ./scripts/build-app.sh

  linux:
    name: Build and test (Linux, portable FFT)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
