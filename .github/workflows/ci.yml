name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS, Accelerate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
      - name: Bundle the app
        run: ./scripts/build-app.sh
      - name: Build the iPad remote's screens for iOS
        run: xcodebuild -scheme MeasureRemoteUI -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build the iPad remote app
        working-directory: RemoteApp/Measure Remote.swiftpm
        run: xcodebuild -scheme 'Measure Remote' -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build

  linux:
    name: Build and test (Linux, portable FFT)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
